name: Build tariff rates

# One job per tracker revision (GitHub's standard Linux runners: 4 cores, 16 GB; a revision peaks near 10 GB), then
# one release per tracker commit and driver version holding every revision's Parquet file and a manifest.
on:
  push:
    branches: [main]
    paths: [TRACKER_COMMIT, a1_revision.R, weights.R, scripts/**, .github/**]
  schedule:
    - cron: '17 9 * * 1'   # weekly: boundary revisions can appear as dates pass the last revision's horizon
  workflow_dispatch:
    inputs:
      revisions:
        description: Revisions to rebuild, space-separated (blank = only what is missing or stale)
        required: false
        default: ''
      rebuild_all:
        description: Rebuild every revision
        type: boolean
        default: false
      weights:
        description: Rebuild the import weights even if nothing else changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-rates
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      commit: ${{ steps.setup.outputs.commit }}
      count: ${{ steps.plan.outputs.count }}
      orphans: ${{ steps.plan.outputs.orphans }}
      matrix: ${{ steps.plan.outputs.matrix }}
      weights: ${{ steps.weights.outputs.weights }}
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
      - name: List the tracker's revisions
        env:
          TRACKER: ${{ steps.setup.outputs.tracker }}
        run: |
          mkdir -p plan
          Rscript a1_revision.R --tracker "$TRACKER" --out "$RUNNER_TEMP/a1" --list > plan/revisions.csv
          Rscript a1_revision.R --tracker "$TRACKER" --out "$RUNNER_TEMP/a1" --boundaries > plan/boundaries.csv
      - name: Read the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets -q '.assets[].name' > plan/assets.txt 2>/dev/null; then
            gh release download "$TAG" -p manifest.csv -D plan || true
          else
            : > plan/assets.txt
          fi
      - id: plan
        env:
          ONLY: ${{ inputs.revisions }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          all=(); [ "$REBUILD_ALL" = true ] && all=(--rebuild-all)
          python3 scripts/plan.py --revisions plan/revisions.csv --boundaries plan/boundaries.csv \
            --manifest plan/manifest.csv --assets plan/assets.txt --only "$ONLY" "${all[@]}" --out plan
      # The weights are keyed to the tip revision's codes: rebuilt whenever any revision is (re)built, or if missing.
      - id: weights
        env:
          COUNT: ${{ steps.plan.outputs.count }}
          FORCE: ${{ inputs.weights }}
        run: |
          w=false
          if [ "$COUNT" != 0 ] || [ "$FORCE" = true ] || ! grep -qx weights_meta.csv plan/assets.txt; then w=true; fi
          echo "weights=$w" >> "$GITHUB_OUTPUT"; echo "weights: $w"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan/
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
      - name: Build ${{ matrix.revision }}
        env:
          TRACKER: ${{ steps.setup.outputs.tracker }}
          REV: ${{ matrix.revision }}
          KIND: ${{ matrix.kind }}
          OWNER: ${{ matrix.owner }}
          DATE: ${{ matrix.effective_date }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          extra=()
          [ "$KIND" = boundary ] && extra=(--owner "$OWNER" --date "$DATE")
          free -m | head -2
          /usr/bin/time -v -o "$out/peak_$REV.txt" \
            Rscript a1_revision.R --tracker "$TRACKER" --out "$out" --revision "$REV" "${extra[@]}"
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" "$out/peak_$REV.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: rev-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/out/rates_*.parquet
            ${{ runner.temp }}/out/meta_*.csv
            ${{ runner.temp }}/out/peak_*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: >
      always() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.plan.outputs.count != '0' || needs.plan.outputs.orphans != '0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: rev-*
          path: built
          merge-multiple: true
      - name: Check and write the manifest
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          mkdir -p built
          python3 scripts/manifest.py --required plan/required.csv --old-manifest plan/manifest.csv \
            --built built --driver-hash "$(git hash-object a1_revision.R | cut -c1-7)" --tracker-commit "$COMMIT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Budget-Lab-Yale/tariff-rate-tracker/$COMMIT/LICENSE" \
            -o release/LICENSE-tariff-rate-tracker.txt
          {
            echo "Tariff rates by HTS product and country for every revision of the Budget Lab at Yale's"
            echo "[tariff-rate-tracker](https://github.com/Budget-Lab-Yale/tariff-rate-tracker) at commit"
            echo "[\`${COMMIT:0:7}\`](https://github.com/Budget-Lab-Yale/tariff-rate-tracker/tree/$COMMIT),"
            echo "built one revision at a time by its own \`build_revision_snapshot()\`, unmodified."
            echo "\`manifest.csv\` lists each file with its effective date, owner archive, row count and SHA-256."
            echo
            echo "These files are derived from tariff-rate-tracker, used under its MIT License:"
            echo
            echo '```'
            cat release/LICENSE-tariff-rate-tracker.txt
            echo '```'
          } > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rates, tracker ${COMMIT:0:7}" --notes-file notes.md
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          files=(release/manifest.csv release/LICENSE-tariff-rate-tracker.txt)
          shopt -s nullglob
          files+=(built/rates_*.parquet)
          gh release upload "$TAG" "${files[@]}" --clobber
          while read -r f; do
            [ -n "$f" ] && gh release delete-asset "$TAG" "$f" -y
          done < release/orphans.txt
          gh release edit "$TAG" --latest
          echo "published $TAG: $(($(wc -l < release/manifest.csv) - 1)) revisions" >> "$GITHUB_STEP_SUMMARY"

  # 2024 Census imports by HS10 x country, keyed to the tip revision's codes by the tracker's own
  # build_panel_import_weights() (484(f) transfers, 2025 split shares), as its published vintages carry.
  weights:
    needs: [plan, build, publish]
    if: >
      always() && needs.plan.result == 'success' && needs.plan.outputs.weights == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
      # The tracker's builder downloads with R's 60-second default timeout, too short for Census's ~60 MB monthly
      # files from these runners; it uses ZIPs already in data/weights/raw/<year>/ (its documented manual path).
      - name: Download Census's monthly import files
        working-directory: ${{ steps.setup.outputs.tracker }}
        run: |
          for year in 2024 2025; do
            mkdir -p "data/weights/raw/$year"
            for mm in 01 02 03 04 05 06 07 08 09 10 11 12; do
              f="IMDB${year:2:2}${mm}.ZIP"
              curl -fsS --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 1200 \
                -o "data/weights/raw/$year/$f" -w "$f %{http_code} %{size_download} bytes %{time_total}s\n" \
                "https://www.census.gov/trade/downloads/$year/Merch/im_m/$f"
              unzip -l "data/weights/raw/$year/$f" | grep -qi IMP_DETL || { echo "$f is not an IMP_DETL zip"; exit 1; }
            done
          done
      - name: Census 2024 and 2025 imports
        working-directory: ${{ steps.setup.outputs.tracker }}
        run: |
          Rscript src/io/build_import_weights.R --year 2024
          Rscript src/io/build_import_weights.R --year 2025 --no-gtap
          ls -la data/weights
      - name: Key the weights to the tip revision
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TRACKER: ${{ steps.setup.outputs.tracker }}
        run: |
          mkdir -p tip
          gh release download "$TAG" -p manifest.csv -D tip
          tipfile=$(python3 -c "import csv; r=max(csv.DictReader(open('tip/manifest.csv')), key=lambda m: m['effective_date']); print(r['file'])")
          gh release download "$TAG" -p "$tipfile" -D tip
          Rscript weights.R --tracker "$TRACKER" --release tip --out weights
          cat weights/weights_meta.csv
          ls -la weights
      - name: Publish the weights
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(weights/import_weights_hs10_country.parquet weights/weights_meta.csv weights/*crosswalk*.csv)
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "weights: $(tail -1 weights/weights_meta.csv)" >> "$GITHUB_STEP_SUMMARY"
