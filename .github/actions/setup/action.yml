name: Set up the tracker and R
description: Fetch Budget Lab's tariff-rate-tracker at the pinned commit and install R with its packages.
outputs:
  tracker:
    description: Path of the tracker clone
    value: ${{ steps.clone.outputs.tracker }}
  commit:
    description: The pinned tracker commit
    value: ${{ steps.clone.outputs.commit }}
  tag:
    description: Release tag for this tracker commit and driver
    value: ${{ steps.clone.outputs.tag }}
runs:
  using: composite
  steps:
    - id: clone
      shell: bash
      run: |
        commit=$(tr -d '[:space:]' < TRACKER_COMMIT)
        [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "TRACKER_COMMIT is not a full commit hash"; exit 1; }
        tracker="$RUNNER_TEMP/tariff-rate-tracker"
        git init -q "$tracker"
        git -C "$tracker" remote add origin https://github.com/Budget-Lab-Yale/tariff-rate-tracker
        for i in 1 2 3; do git -C "$tracker" fetch -q --depth 1 origin "$commit" && break; sleep 20; done
        git -C "$tracker" checkout -q FETCH_HEAD
        [ "$(git -C "$tracker" rev-parse HEAD)" = "$commit" ]
        driver=$(git hash-object a1_revision.R | cut -c1-7)
        echo "tracker=$tracker" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "tag=rates-${commit:0:7}-d${driver}" >> "$GITHUB_OUTPUT"
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.1'
        use-public-rspm: true
    # The tracker's tools/install_dependencies.R lists tidyverse, jsonlite, yaml, here (required) and digest, arrow,
    # openxlsx, httr, future, future.apply, parallelly, callr (optional; arrow writes the Parquet). pdftools is only
    # for its Chapter 99 PDF scraper, which this build does not run.
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::tidyverse
          any::jsonlite
          any::yaml
          any::here
          any::digest
          any::arrow
          any::openxlsx
          any::httr
          any::future
          any::future.apply
          any::parallelly
          any::callr
        cache-version: 1
    - shell: bash
      run: command -v /usr/bin/time >/dev/null || sudo apt-get install -y -qq time
